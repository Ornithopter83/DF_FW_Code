; Copy to connection.ini beside BoardWifiConnector.exe.
; USB enrollment fills ProfileName, InterfaceGuid and BoardId.
; Never put Wi-Fi passwords or authentication tokens in this INI.
[Connection]
WifiProfileName=
WifiInterfaceGuid=
BoardAddress=192.168.4.1
TcpPort=45180
BoardId=
RetrySeconds=5
ResponseTimeoutSeconds=8
HeartbeatSeconds=2
; false = receive requests but never acknowledge or shut down Windows.
; true = accept authenticated board requests and initiate Windows shutdown.
AllowWindowsShutdown=false
